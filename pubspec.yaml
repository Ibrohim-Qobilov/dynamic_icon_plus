name: dynamic_icon_plus
description: Modern Flutter plugin for dynamically changing app launcher icons at runtime on Android and iOS without restarting the application.
version: 0.1.0
homepage: https://github.com/Ibrohim-Qobilov/dynamic_icon_plus
repository: https://github.com/Ibrohim-Qobilov/dynamic_icon_plus
issue_tracker: https://github.com/Ibrohim-Qobilov/dynamic_icon_plus/issues

topics:
  - app-icon
  - dynamic-icon
  - launcher-icon
  - ios
  - android

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.ibrohim.dynamic_icon_plus
        pluginClass: DynamicIconPlusPlugin
      ios:
        pluginClass: DynamicIconPlusPlugin
